<title>فحص WebGPU للموبايل</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* layout: one narrow column of check rows, a verdict card on top, a copy button at the end */
:root{--bg:#f2f1ed;--card:#fbfaf7;--ink:#1d2026;--muted:#5d646e;--rule:#d9d5cc;--ok:#1f8a4c;--warn:#b26a00;--bad:#c0392b;--acc:#2f6fe0;
  --sans:"Cairo","Segoe UI",Tahoma,sans-serif;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171b;--card:#1d2026;--ink:#e8e9ec;--muted:#a1a8b2;--rule:#33373f;--ok:#4cc884;--warn:#f0a83a;--bad:#ff7a6b;--acc:#7fa8ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15171b;--card:#1d2026;--ink:#e8e9ec;--muted:#a1a8b2;--rule:#33373f;--ok:#4cc884;--warn:#f0a83a;--bad:#ff7a6b;--acc:#7fa8ff;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.7;margin:0;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:640px;margin:0 auto;display:grid;gap:14px}
h1{font-size:1.35rem;margin:0;text-wrap:balance}
p{margin:0}.muted{color:var(--muted);font-size:.9rem}
.verdict{background:var(--card);border:2px solid var(--rule);border-radius:14px;padding:14px 16px;display:grid;gap:6px}
.verdict.ok{border-color:var(--ok)}.verdict.warn{border-color:var(--warn)}.verdict.bad{border-color:var(--bad)}
.verdict b{font-size:1.1rem}
.rows{background:var(--card);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:10px 14px;border-top:1px solid var(--rule);align-items:start}
.row:first-child{border-top:0}
.ic{font-weight:700}.ic.ok{color:var(--ok)}.ic.warn{color:var(--warn)}.ic.bad{color:var(--bad)}.ic.wait{color:var(--muted)}
.row small{display:block;color:var(--muted);font-size:.82rem}
.v{font-family:var(--mono);font-size:.85rem;direction:ltr;unicode-bidi:isolate;overflow-wrap:anywhere}
button{font:inherit;font-weight:700;padding:10px 16px;border-radius:10px;border:0;background:var(--acc);color:#fff;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
pre{direction:ltr;text-align:left;background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:10px;font:400 .78rem/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
</style>
<main dir="rtl" lang="ar">
  <h1>فحص الموبايل: ينفع يشغّل نموذج ذكاء جوه Chrome؟</h1>
  <p class="muted">الصفحة دي بتسأل المتصفح عن كارت الشاشة (WebGPU)، وبتعمل اختبار سرعة صغير (ضرب مصفوفات). مابتحمّلش أي نموذج ومابتبعتش حاجة لأي مكان. افتحها في <b>Chrome</b> على الموبايل، مش جوه تطبيق Claude.</p>
  <div class="verdict" id="verdict"><b>بيفحص…</b><span class="muted">استنى ثواني.</span></div>
  <div class="rows" id="rows"></div>
  <button type="button" id="copy">📋 انسخ النتيجة وابعتهالي</button>
  <pre id="raw" hidden></pre>
</main>
<script>
(() => {
  const R = {}; const rows = document.getElementById('rows');
  const esc = t => String(t).replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c]));
  function row(state, title, value, note){ const d = document.createElement('div'); d.className = 'row';
    d.innerHTML = `<span class="ic ${state}">${{ok: '✓', warn: '!', bad: '✕', wait: '…'}[state]}</span><div><b>${title}</b>${value != null ? ` <span class="v">${esc(value)}</span>` : ''}${note ? `<small>${note}</small>` : ''}</div>`; rows.appendChild(d); return d; }
  const MB = n => (n / 1048576).toFixed(0) + ' MB';
  async function run(){
    const ua = navigator.userAgent; R.ua = ua; R.where = /; wv\)|Claude/i.test(ua) ? 'webview' : 'browser';
    R.cores = navigator.hardwareConcurrency || null; R.memGB = navigator.deviceMemory || null;
    row(R.where === 'browser' ? 'ok' : 'warn', 'مكان الفتح', R.where === 'browser' ? 'متصفح عادي' : 'جوه تطبيق (WebView)', R.where === 'browser' ? '' : 'افتح الرابط في Chrome نفسه للنتيجة الحقيقية.');
    row('ok', 'أنوية المعالج', R.cores, R.memGB ? `المتصفح بيقول الرام ≥ ${R.memGB} جيجا (المتصفح بيدّي رقم تقريبي وأقصاه 8).` : '');
    if (!('gpu' in navigator)){ R.webgpu = false; row('bad', 'WebGPU', 'مش موجود', 'المتصفح ده مش بيدعم WebGPU. جرّب آخر نسخة من Chrome.'); return finish(); }
    R.webgpu = true; row('ok', 'WebGPU', 'موجود');
    let ad = null; try { ad = await navigator.gpu.requestAdapter({powerPreference: 'high-performance'}); } catch (e) {}
    if (!ad){ R.adapter = false; row('bad', 'كارت الشاشة', 'المتصفح ماادّاش كارت', 'WebGPU موجودة بس مقفولة على الجهاز ده.'); return finish(); }
    R.adapter = true; let info = {}; try { info = ad.info || (ad.requestAdapterInfo ? await ad.requestAdapterInfo() : {}); } catch (e) {}
    R.gpu = {vendor: info.vendor || '', arch: info.architecture || '', desc: info.description || ''};
    row('ok', 'كارت الشاشة', [R.gpu.vendor, R.gpu.arch, R.gpu.desc].filter(Boolean).join(' · ') || 'مش معروف الاسم');
    R.f16 = ad.features.has('shader-f16'); row(R.f16 ? 'ok' : 'warn', 'حساب بنص الدقة (shader-f16)', R.f16 ? 'متاح' : 'مش متاح', R.f16 ? 'ده بيخلّي النماذج أسرع وأصغر.' : 'لسه ينفع، بس النموذج هيبقى أبطأ وأكبر.');
    const L = ad.limits; R.limits = {maxBufferSize: L.maxBufferSize, maxStorageBufferBindingSize: L.maxStorageBufferBindingSize, maxComputeWorkgroupStorageSize: L.maxComputeWorkgroupStorageSize, maxComputeInvocationsPerWorkgroup: L.maxComputeInvocationsPerWorkgroup};
    const big = L.maxStorageBufferBindingSize >= 1073741824 / 2;
    row(big ? 'ok' : (L.maxStorageBufferBindingSize >= 134217728 ? 'warn' : 'bad'), 'أكبر حتة ذاكرة الكارت يقبلها', MB(L.maxStorageBufferBindingSize), `maxBufferSize ${MB(L.maxBufferSize)}. النماذج الصغيرة محتاجة 128 MB على الأقل.`);
    let dev = null; try { dev = await ad.requestDevice({requiredLimits: {maxStorageBufferBindingSize: L.maxStorageBufferBindingSize, maxBufferSize: L.maxBufferSize}}); } catch (e) { try { dev = await ad.requestDevice(); } catch (e2) {} }
    if (!dev){ R.device = false; row('bad', 'تشغيل الكارت', 'فشل'); return finish(); }
    R.device = true; const r = row('wait', 'اختبار السرعة (ضرب مصفوفتين 1024 × 1024)', 'بيشتغل…');
    try { R.gflops = await bench(dev); r.querySelector('.ic').className = 'ic ' + (R.gflops > 100 ? 'ok' : R.gflops > 30 ? 'warn' : 'bad'); r.querySelector('.ic').textContent = R.gflops > 30 ? '✓' : '!';
      r.querySelector('.v').textContent = R.gflops.toFixed(0) + ' GFLOPS'; }
    catch (e){ R.gflops = null; r.querySelector('.ic').className = 'ic bad'; r.querySelector('.v').textContent = 'فشل: ' + (e && e.message || e); }
    finish(); }
  async function bench(dev){ const N = 1024, T = 16;
    const code = `@group(0) @binding(0) var<storage, read> A: array<f32>; @group(0) @binding(1) var<storage, read> B: array<f32>; @group(0) @binding(2) var<storage, read_write> C: array<f32>;
      var<workgroup> As: array<f32, ${T * T}>; var<workgroup> Bs: array<f32, ${T * T}>;
      @compute @workgroup_size(${T}, ${T}) fn main(@builtin(global_invocation_id) g: vec3u, @builtin(local_invocation_id) l: vec3u){
        var acc = 0.0; let row = g.y; let col = g.x;
        for (var t = 0u; t < ${N}u; t += ${T}u){ As[l.y * ${T}u + l.x] = A[row * ${N}u + t + l.x]; Bs[l.y * ${T}u + l.x] = B[(t + l.y) * ${N}u + col]; workgroupBarrier();
          for (var k = 0u; k < ${T}u; k++){ acc += As[l.y * ${T}u + k] * Bs[k * ${T}u + l.x]; } workgroupBarrier(); }
        C[row * ${N}u + col] = acc; }`;
    const mod = dev.createShaderModule({code}); const pipe = dev.createComputePipeline({layout: 'auto', compute: {module: mod, entryPoint: 'main'}});
    const sz = N * N * 4; const mk = u => dev.createBuffer({size: sz, usage: u});
    const a = mk(GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST), b = mk(GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST), c = mk(GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC);
    const data = new Float32Array(N * N).map((_, i) => (i % 7) * .1); dev.queue.writeBuffer(a, 0, data); dev.queue.writeBuffer(b, 0, data);
    const bg = dev.createBindGroup({layout: pipe.getBindGroupLayout(0), entries: [a, b, c].map((buffer, binding) => ({binding, resource: {buffer}}))});
    const once = async reps => { const enc = dev.createCommandEncoder(); const pass = enc.beginComputePass(); pass.setPipeline(pipe); pass.setBindGroup(0, bg);
      for (let r = 0; r < reps; r++) pass.dispatchWorkgroups(N / T, N / T); pass.end(); dev.queue.submit([enc.finish()]); await dev.queue.onSubmittedWorkDone(); };
    await once(1); const reps = 8; const t0 = performance.now(); await once(reps); const ms = performance.now() - t0;
    return 2 * N * N * N * reps / (ms / 1000) / 1e9; }
  function finish(){ const v = document.getElementById('verdict'); let cls, head, text;
    if (!R.webgpu || !R.adapter || !R.device){ cls = 'bad'; head = 'مش هينفع دلوقتي'; text = 'المتصفح ده مش بيدّي كارت الشاشة للصفحات. لو انت فاتح من جوه تطبيق، افتح الرابط في Chrome.'; }
    else if ((R.gflops || 0) > 100 && R.limits.maxStorageBufferBindingSize >= 134217728){ cls = 'ok'; head = 'ينفع ✓'; text = 'الموبايل ده يقدر يشغّل نموذج صغير بيفكر (حوالي 1.5 لـ 3 مليار) جوه Chrome. ابعتلي النتيجة عشان أختار الحجم المناسب.'; }
    else { cls = 'warn'; head = 'ينفع، بس ببطء'; text = 'WebGPU شغالة بس السرعة أو الذاكرة محدودة. نموذج صغير جداً ممكن يشتغل. ابعتلي النتيجة.'; }
    v.className = 'verdict ' + cls; v.innerHTML = `<b>${head}</b><span class="muted">${text}</span>`;
    const raw = document.getElementById('raw'); raw.textContent = JSON.stringify(R, null, 1); raw.hidden = false; }
  document.getElementById('copy').onclick = async e => { const t = document.getElementById('raw').textContent || JSON.stringify(R);
    try { await navigator.clipboard.writeText(t); e.target.textContent = '✔ اتنسخ، ابعتهولي في الشات'; }
    catch (x){ const r = document.createRange(); r.selectNodeContents(document.getElementById('raw')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); e.target.textContent = 'النص متعلّم، انسخه بإيدك'; } };
  run().catch(e => { row('bad', 'حصل خطأ', String(e && e.message || e)); finish(); });
})();
</script>
